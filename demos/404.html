<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Redirecting...</title>
<script>
(function() {
    var path = window.location.pathname;
    var segments = path.split('/').filter(Boolean);
    var last = segments[segments.length - 1] || '';
    var routes = {'':'index.html','index':'index.html','about':'about.html','contact':'contact.html','portfolio':'portfolio.html','testimonials':'testimonials.html','basic':'index.html','standar':'index.html','premium':'index.html','services':'services.html','blog':'blog.html','faq':'faq.html','story':'story.html','locations':'locations.html','menu':'menu.html','admin':'admin.html','blog-post':'blog-post.html','products':'products.html','product-detail':'product-detail.html'};
    if (routes[last]) { window.location.replace(routes[last]); }
    else if (last) { window.location.replace(last + '.html'); }
    else { window.location.replace('index.html'); }
})();
</script></head><body><p>Redirecting...</p></body></html>
