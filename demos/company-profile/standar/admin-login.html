<!DOCTYPE html>
<html lang="id" data-page="admin-login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login - Panel manajemen Sakura Koi Indonesia untuk mengelola artikel, galeri, koi, testimoni, dan FAQ.">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Sakura Koi Indonesia</title>
    <link rel="icon" href="https://img.icons8.com/color/96/fish--v1.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- ===== ADMIN LOGIN (Panel CRUD) ===== -->
    <div class="admin-login-section">
        <div class="admin-login-bg" aria-hidden="true"></div>
        <div class="admin-login-box">
            <div class="admin-login-logo">
                <i class="fas fa-water"></i>
                <h1>Admin Panel</h1>
                <p><strong>Sakura Koi Indonesia</strong></p>
                <p>Kelola artikel, galeri, koi, testimoni & FAQ</p>
            </div>
            <div class="admin-login-error" id="adminLoginError"></div>
            <form class="admin-login-form" id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="adminPassword">Password Admin</label>
                    <input type="password" id="adminPassword" name="adminPassword" class="form-control" placeholder="Masukkan password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fas fa-lock"></i> Masuk ke Panel</button>
            </form>
            <div class="admin-login-info" style="margin-top:16px;font-size:var(--tiny);color:var(--text-muted);text-align:center">
                <i class="fas fa-info-circle"></i> Password demo: <code>admin123</code>
            </div>
            <div style="text-align:center;margin-top:16px">
                <a href="index.html" style="font-size:var(--tiny);color:var(--text-muted)"><i class="fas fa-arrow-left"></i> Kembali ke website</a>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
