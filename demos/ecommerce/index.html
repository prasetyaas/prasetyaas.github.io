<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopVerse — E-Commerce Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo">ShopVerse</a>
            <div class="nav-search">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari produk..." oninput="renderProducts()">
            </div>
            <div class="nav-actions">
                <button class="cart-btn" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <span class="hero-tag">Flash Sale — Diskon hingga 50%</span>
                <h1>Belanja Kebutuhan <span class="text-gradient">Hari Ini</span></h1>
                <p>Produk original, harga terbaik, gratis ongkir se-Indonesia.</p>
            </div>
            <div class="hero-categories" id="categoryFilter">
                <button class="cat-btn active" data-cat="all">Semua</button>
            </div>
        </div>
    </section>

    <section class="products">
        <div class="container">
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Keranjang Belanja</h3>
            <button class="cart-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <i class="fas fa-shopping-bag"></i>
                <p>Keranjang masih kosong</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-summary">
                <div class="cart-row"><span>Subtotal</span><span id="cartSubtotal">Rp 0</span></div>
                <div class="cart-row"><span>Ongkir</span><span class="text-green">Gratis</span></div>
                <div class="cart-row total"><span>Total</span><span id="cartTotal">Rp 0</span></div>
            </div>
            <button class="btn btn-primary btn-full" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 ShopVerse. Demo E-Commerce.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
