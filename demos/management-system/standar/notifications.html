<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notifikasi - Management System Premium</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/layout.css"></head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="sidebar-logo">MS</div><div class="sidebar-brand">Management<span>System</span></div><button class="sidebar-close" id="sidebarClose">&times;</button></div>
<nav class="sidebar-nav">
<div class="nav-label">Menu Utama</div><a href="dashboard.html" class="nav-item" data-page="dashboard"><i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span></a><a href="transactions.html" class="nav-item" data-page="transactions"><i class="bi bi-cart-plus"></i> <span>Transaksi</span></a><a href="reports.html" class="nav-item" data-page="reports"><i class="bi bi-file-earmark-bar-graph"></i> <span>Laporan</span></a>
<div class="nav-label">Master Data</div><a href="products.html" class="nav-item" data-page="products"><i class="bi bi-boxes"></i> <span>Produk</span></a><a href="customers.html" class="nav-item" data-page="customers"><i class="bi bi-people"></i> <span>Customer</span></a><a href="vendors.html" class="nav-item" data-page="vendors"><i class="bi bi-building"></i> <span>Vendor</span></a>
<div class="nav-label">Lainnya</div><a href="notifications.html" class="nav-item active" data-page="notifications"><i class="bi bi-bell"></i> <span>Notifikasi</span><span class="badge">3</span></a><a href="profile.html" class="nav-item" data-page="profile"><i class="bi bi-person-circle"></i> <span>Profile</span></a><a href="settings.html" class="nav-item" data-page="settings"><i class="bi bi-gear"></i> <span>Pengaturan</span></a><a href="help.html" class="nav-item" data-page="help"><i class="bi bi-question-circle"></i> <span>Bantuan</span></a>
</nav>
<div class="sidebar-footer"><div class="sidebar-user"><div class="user-avatar" id="userAvatar">U</div><div class="user-info"><strong class="user-name" id="userName">User</strong><span class="user-role" id="userRole">Role</span></div></div><button class="btn btn-sm btn-ghost" id="logoutBtn" style="color:var(--danger);margin-top:8px;width:100%;"><i class="bi bi-box-arrow-right"></i> Keluar</button></div>
</aside><div class="sidebar-overlay" id="sidebarOverlay"></div>
<main class="main">
<header class="navbar-top"><button class="navbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button><div class="navbar-title">Notifikasi</div><div class="navbar-spacer"></div><div class="navbar-right"><button class="navbar-btn" id="themeToggle" data-tooltip="Toggle Theme"><i class="bi bi-moon"></i></button></div></header>
<div class="content">
<div class="breadcrumb"><a href="dashboard.html">Dashboard</a><i class="bi bi-chevron-right"></i><span>Notifikasi</span></div>
<div class="page-header"><div class="page-header-left"><h1>Notifikasi</h1><p>Semua notifikasi dan pemberitahuan sistem</p></div><div class="page-actions"><button class="btn btn-secondary" onclick="showToast('Semua notifikasi ditandai sudah dibaca','success')"><i class="bi bi-check-all"></i> Tandai Dibaca</button></div></div>
<div class="notification-tabs">
<div class="tabs-pills">
<button class="tab-pill active" onclick="filterNotif('all',this)">Semua</button>
<button class="tab-pill" onclick="filterNotif('unread',this)">Belum Dibaca</button>
<button class="tab-pill" onclick="filterNotif('Transaction',this)">Transaksi</button>
<button class="tab-pill" onclick="filterNotif('System',this)">Sistem</button>
</div></div>
<div class="card"><div class="card-body p-0"><div class="notification-list" id="notificationList"></div></div></div>
</div>
<footer class="footer"><span>&copy; 2026 Management System Premium Demo</span><a href="../../index.html">Kembali ke Portfolio</a></footer>
</main></div>
<div class="toast-container" id="toastContainer"></div>
<script src="js/app.js"></script>
<script>
var notifFilter = 'all';
function initNotifications() {
  setActiveNav('notifications');
  renderNotifications();
}
function filterNotif(filter, btn) {
  notifFilter = filter;
  document.querySelectorAll('.tab-pill').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderNotifications();
}
function renderNotifications() {
  var list = document.getElementById('notificationList');
  if (!list) return;
  var data = AppState.data.notifications || [];
  if (notifFilter === 'unread') data = data.filter(function(n) { return !n.read; });
  else if (notifFilter !== 'all') data = data.filter(function(n) { return n.category === notifFilter; });
  if (data.length === 0) {
    list.innerHTML = '<div class="empty-state"><i class="bi bi-bell" style="font-size:48px;color:var(--text-3);opacity:0.4;"></i><h3>Tidak ada notifikasi</h3><p>Semua notifikasi telah dibaca</p></div>';
    return;
  }
  var iconMap = {warning:'bi-exclamation-triangle',info:'bi-info-circle',success:'bi-check-circle',danger:'bi-x-circle'};
  var colorMap = {warning:'var(--warning)',info:'var(--info)',success:'var(--success)',danger:'var(--danger)'};
  list.innerHTML = data.map(function(n) {
    var icon = iconMap[n.type] || 'bi-info-circle';
    var color = colorMap[n.type] || 'var(--info)';
    var unread = n.read ? '' : ' unread';
    return '<div class="notification-item' + unread + '" onclick="showToast(\'' + n.title + '\',\'info\')"><div class="notification-icon" style="background:' + color + '"><i class="bi ' + icon + '"></i></div><div class="notification-content"><strong class="notification-title">' + n.title + '</strong><span class="notification-desc">' + n.message + '</span></div><span class="notification-time">' + n.time + '</span></div>';
  }).join('');
}
document.addEventListener('DOMContentLoaded', initNotifications);
</script>
</body></html>
